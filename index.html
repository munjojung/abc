<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC 문서</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    pre {
      overflow-x: auto;
      padding: 12px;
      background: #f4f4f4;
    }
  </style>
</head>
<body>
  <div id="content">문서를 불러오는 중입니다...</div>

  <script>
    fetch('./ABC.md')
      .then(response => {
        if (!response.ok) {
          throw new Error('ABC.md 파일을 불러오지 못했습니다.');
        }
        return response.text();
      })
      .then(markdown => {
        document.getElementById('content').innerHTML =
          marked.parse(markdown);
      })
      .catch(error => {
        document.getElementById('content').textContent =
          error.message;
      });
  </script>
</body>
</html>
